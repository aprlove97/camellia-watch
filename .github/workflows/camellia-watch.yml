name: camellia-watch

# 이 파일은 저장소의 .github/workflows/camellia-watch.yml 위치에 두어야 한다.

on:
  schedule:
    # 5분마다. 깃허브 부하에 따라 실제로는 5~15분 간격으로 도는 경우가 많다.
    - cron: '*/5 * * * *'
  workflow_dispatch:          # Actions 탭에서 수동 실행 (첫 테스트용)
    inputs:
      dump:
        description: '모든 등급 탭 내용을 아티팩트로 저장'
        type: boolean
        default: true

concurrency:
  group: camellia-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 좌석 확인
        id: check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # ▼ 감시 조건은 여기만 고치면 된다
          TARGET_DATE: '2026-10-02'
          TARGET_TAB: '1 등 양실 (2 명)'
          PASSENGERS: '2'
          DEPART_FROM_BUSAN: '1'
          DUMP: ${{ (github.event_name == 'workflow_dispatch' && inputs.dump) && '1' || '0' }}
        run: python check_camellia.py

      # 수동 실행이거나 뭔가 걸렸을 때만 디버그 파일을 남긴다 (5분마다 쌓이면 곤란하므로)
      - name: 디버그 파일 업로드
        if: always() && (github.event_name == 'workflow_dispatch' || steps.check.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: camellia-debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
