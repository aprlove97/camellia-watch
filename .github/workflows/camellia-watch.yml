name: camellia-watch

on:
  schedule:
    - cron: '*/5 * * * *'    # 5분마다 감시
    - cron: '2 12 * * *'     # 매일 21:02 KST — 생존 알림 (UTC 12:02)
  workflow_dispatch:

concurrency:
  group: camellia-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      # 정확히 일정한 간격으로 접속하지 않도록 0~30초 무작위로 늦춘다.
      # 저녁 9시 생존 알림과 수동 실행은 지연 없이 바로 돈다.
      - name: 무작위 지연
        if: github.event_name == 'schedule' && github.event.schedule != '2 12 * * *'
        run: |
          WAIT=$((RANDOM % 31))
          echo "${WAIT}초 대기 후 조회"
          sleep $WAIT

      - name: 좌석 확인
        id: check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # ── 감시 조건. 여기만 고치면 된다 ──
          TARGET_DATE: '2026-10-02'      # 출발일
          PASSENGERS: '2'                # 인원
          DEPART_FROM_BUSAN: '1'         # 1 = 부산→하카타
          TEST_MODE: '0'                 # 평소 '0'. 알림 시험할 때만 '1'

          # 저녁 9시 예약 실행일 때만 생존 알림을 켠다 (건드릴 필요 없음)
          HEARTBEAT: ${{ github.event.schedule == '2 12 * * *' && '1' || '0' }}
        run: python check_camellia.py

      - name: 디버그 파일 업로드
        if: always() && (github.event_name == 'workflow_dispatch' || steps.check.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: camellia-debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
