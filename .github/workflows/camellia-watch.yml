name: camellia-watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: camellia-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 좌석 확인
        id: check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # ── 감시 조건. 여기만 고치면 된다 ──
          TARGET_DATE: '2026-10-02'      # 출발일
          PASSENGERS: '2'                # 인원
          DEPART_FROM_BUSAN: '1'         # 1 = 부산→하카타, 0 = 하카타→부산
          TEST_MODE: '0'                 # 평소 '0'. 알림 시험할 때만 '1'
        run: python check_camellia.py

      # 수동 실행이거나 뭔가 걸렸을 때만 저장한다.
      # 5분마다 쌓으면 무료 저장 용량을 넘긴다.
      - name: 디버그 파일 업로드
        if: always() && (github.event_name == 'workflow_dispatch' || steps.check.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: camellia-debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
