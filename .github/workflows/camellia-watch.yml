name: camellia-watch

# ─────────────────────────────────────────────────────────────
# 깃허브의 예약 실행(cron)은 고빈도로 걸어도 대부분 건너뛴다.
# '*/5' 로 걸었더니 실제로는 3시간 반에 한 번 도는 수준이었다.
# 그래서 예약 실행에 5분 정확도를 기대하지 않고,
# 실행 하나를 오래 살려두고 그 안에서 직접 시간을 재며 반복한다.
#
#   * 루프 최대 5시간 30분 (깃허브 작업 한도 6시간 안에서)
#   * 트리거는 2시간마다 → 연속 두 번 건너뛰어도 공백이 없다
#   * 돌던 루프를 죽이지 않는다. 예약 실행은 줄을 섰다가 이어받는다
#   * KST 00:30 ~ 06:30 은 쉰다 (그 시간엔 알림을 봐도 움직일 수 없으므로)
#
# 수동 실행 두 가지
#   test  … 1회만 확인하고 생존 알림 발송. 알림이 잘 오는지 시험할 때
#   watch … 긴 감시 루프를 지금 바로 시작. 예약이 안 걸릴 때
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # KST 06:35 / 08:35 / 10:35 / 12:35 / 14:35 / 16:35 / 18:35 / 20:35 / 22:35
    - cron: '35 1,3,5,7,9,11,13,21,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = 1회 확인 + 생존 알림 / watch = 긴 감시 루프 시작'
        type: choice
        default: test
        options:
          - test
          - watch

concurrency:
  # 시험 실행은 감시 루프와 따로 논다. 감시끼리는 하나만 돈다.
  group: camellia-${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'test') && 'test' || 'watch' }}
  # 수동 실행은 즉시 자리를 차지하고, 예약 실행은 줄을 서서 이어받는다.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345      # 루프 330분 + 설치 여유. 한도 360분 이내

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 좌석 감시 루프
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # ── 감시 조건. 여기만 고치면 된다 ──
          TARGET_DATE: '2026-10-02'      # 출발일
          PASSENGERS: '2'                # 인원
          DEPART_FROM_BUSAN: '1'         # 1 = 부산→하카타
          TEST_MODE: '0'                 # 평소 '0'. 조건 무시하고 알림 보고 싶을 때만 '1'
        run: |
          # 쉬는 시간: KST 00:30 ~ 06:30
          is_quiet () {
            local now
            now=$(( 10#$(TZ=Asia/Seoul date +%H%M) ))
            [ "$now" -ge 30 ] && [ "$now" -lt 630 ]
          }

          MODE="watch"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test" ]; then
            MODE="test"
          fi

          if [ "$MODE" = "test" ]; then
            LOOP_MINUTES=0        # 1회만
            FORCE_HB=1            # 생존 알림 무조건 발송
          else
            LOOP_MINUTES=330      # 5시간 30분
            FORCE_HB=0
          fi

          echo "실행 방식: $MODE   (루프 ${LOOP_MINUTES}분)"

          END=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          N=0

          while : ; do
            # 감시 루프는 쉬는 시간에 들어가면 종료한다
            if [ "$MODE" = "watch" ] && is_quiet; then
              echo "KST $(TZ=Asia/Seoul date '+%H:%M') — 쉬는 시간(00:30~06:30) 진입. 감시를 종료합니다."
              break
            fi

            N=$(( N + 1 ))

            # 저녁 9시대에 하루 한 번만 생존 알림
            HB=$FORCE_HB
            NOW=$(( 10#$(TZ=Asia/Seoul date +%H%M) ))
            if [ "$NOW" -ge 2100 ] && [ "$NOW" -le 2159 ] && [ ! -f /tmp/hb_sent ]; then
              HB=1
            fi
            if [ "$HB" = "1" ]; then
              touch /tmp/hb_sent
            fi

            echo ""
            echo "═══ 확인 #$N   KST $(TZ=Asia/Seoul date '+%m-%d %H:%M')   생존알림=$HB ═══"
            HEARTBEAT=$HB python check_camellia.py || true

            if [ "$(date +%s)" -ge "$END" ]; then
              break
            fi
            sleep $(( 210 + RANDOM % 60 ))   # 확인 시간 포함 약 5분 간격
          done

          echo ""
          echo "종료 — 총 $N 회 확인"

      - name: 디버그 파일 업로드
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: camellia-debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
