name: camellia-watch

on:
  schedule:
  #- cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dump:
        description: '모든 등급 탭 내용을 아티팩트로 저장'
        type: boolean
        default: true

concurrency:
  group: camellia-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 좌석 확인
        id: check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TARGET_DATE: '2026-08-20'
          TARGET_TAB: '2등실'
          PASSENGERS: '2'
          DEPART_FROM_BUSAN: '1'
          DUMP: ${{ (github.event_name == 'workflow_dispatch' && inputs.dump) && '1' || '0' }}
        run: python check_camellia.py

      - name: 디버그 파일 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
